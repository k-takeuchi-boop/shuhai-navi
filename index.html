<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a56a0">
<title>集配ナビ</title>
<style>
:root{
  --primary:#1a56a0;--primary-dark:#123d78;--primary-light:#e8f0fb;
  --accent:#e8a020;--accent-light:#fff8e8;
  --danger:#c0392b;--danger-light:#fdecea;
  --success:#1a7a3c;--success-light:#e8f5ee;
  --text:#1a1a1a;--text-sub:#666;
  --border:#dde3ec;--bg:#f4f6fb;--card:#fff;
  --radius:14px;--shadow:0 2px 10px rgba(26,86,160,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
.login-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;padding:24px;}
.login-box{background:#fff;border-radius:var(--radius);padding:32px 24px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.login-title{font-size:22px;font-weight:bold;color:var(--primary);text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text-sub);text-align:center;margin-bottom:24px;}
.login-lbl{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:6px;display:block;}
.login-input{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:16px;font-family:inherit;}
.login-input:focus{outline:none;border-color:var(--primary);}
.login-err{color:var(--danger);font-size:14px;text-align:center;margin-bottom:12px;display:none;}
body{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.6;}
.hdr{background:var(--primary);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.hdr-back{background:none;border:none;color:#fff;font-size:22px;padding:2px 8px;cursor:pointer;display:none;}
.hdr-back.show{display:block;}
.hdr-title{font-size:18px;font-weight:700;flex:1;}
.hdr-sub{font-size:13px;opacity:.8;}
.hdr-skip{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:8px;color:#fff;font-size:13px;font-weight:700;padding:5px 10px;cursor:pointer;white-space:nowrap;display:none;flex-shrink:0;}
.hdr-skip.show{display:block;}
.pg{display:none;padding-bottom:80px;}.pg.on{display:block;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;box-shadow:0 -2px 8px rgba(0,0,0,.06);}
.tab{flex:1;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--text-sub);font-size:13px;border:none;background:none;}
.tab.on{color:var(--primary);}
.tab-ico{font-size:26px;}
.tab-ico-wrap{position:relative;display:inline-block;}
.badge{background:var(--danger);color:#fff;border-radius:10px;font-size:11px;font-weight:700;padding:1px 5px;min-width:16px;text-align:center;position:absolute;top:-4px;right:-6px;display:none;}
.course-grid{padding:12px 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.course-card{background:var(--card);border-radius:var(--radius);padding:18px 12px;box-shadow:var(--shadow);border:1.5px solid var(--border);cursor:pointer;text-align:center;border-top:4px solid var(--primary);}
.course-card:active{background:var(--primary-light);}
.course-name{font-size:20px;font-weight:700;color:var(--primary);}
.course-info{font-size:14px;color:var(--text-sub);margin-top:3px;}
.pre-sec{background:var(--card);border-radius:var(--radius);margin:12px 14px 0;box-shadow:var(--shadow);overflow:hidden;}
.pre-sec-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.pre-sec-icon{font-size:18px;}
.pre-sec-title{font-size:16px;font-weight:700;flex:1;}
.pre-sec-cnt{font-size:14px;color:var(--text-sub);}
.pre-wb-msg{padding:14px 16px;border-bottom:1px solid var(--border);}
.pre-wb-msg:last-child{border-bottom:none;}
.pre-wb-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.pre-wb-tag{border-radius:5px;padding:4px 10px;font-size:13px;font-weight:700;color:#fff;}
.pre-wb-date{font-size:13px;color:var(--text-sub);}
.pre-wb-author{font-size:13px;color:var(--text-sub);margin-left:auto;}
.pre-wb-text{font-size:17px;font-weight:600;line-height:1.6;margin-bottom:10px;}
.pre-wb-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;}
.pre-wb-btn.done{background:var(--success);}
.pre-wb-none{padding:16px;text-align:center;color:var(--text-sub);font-size:15px;}
.prep-row{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;}
.prep-row:last-child{border-bottom:none;}
.prep-chk{width:28px;height:28px;border-radius:6px;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.prep-chk.on{background:var(--success);border-color:var(--success);color:#fff;}
.prep-txt{font-size:16px;flex:1;}
.prep-txt.on{color:var(--text-sub);text-decoration:line-through;}
.start-wrap{position:fixed;bottom:0;left:0;right:0;padding:14px 16px 20px;background:var(--card);border-top:1px solid var(--border);}
.start-btn{width:100%;background:var(--success);color:#fff;border:none;border-radius:var(--radius);padding:20px;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(26,122,60,.25);}
.start-btn.off{background:#aaa;box-shadow:none;}
.start-hint{text-align:center;font-size:14px;color:var(--text-sub);margin-top:6px;}
.prog-sec{background:var(--card);padding:10px 16px;border-bottom:1px solid var(--border);}
.prog-top{display:flex;justify-content:space-between;margin-bottom:6px;}
.prog-lbl{font-size:15px;color:var(--text-sub);}
.prog-cnt{font-size:15px;font-weight:700;color:var(--primary);}
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;background:var(--success);border-radius:3px;transition:width .4s;}
.fac-card{background:var(--card);border-radius:var(--radius);margin:12px 14px 8px;box-shadow:var(--shadow);overflow:hidden;border:1.5px solid var(--border);}
.fac-hdr{background:var(--primary);color:#fff;padding:14px 16px;}
.fac-seq{font-size:14px;opacity:.8;margin-bottom:2px;}
.fac-name{font-size:26px;font-weight:700;}
.fac-code{font-size:13px;opacity:.75;margin-top:2px;font-family:monospace;}
.fac-row{display:flex;}
.fac-col{flex:1;padding:10px 12px;border-right:1px solid var(--border);}
.fac-col:last-child{border-right:none;}
.fac-col-lbl{font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.5px;}
.fac-col-val{font-size:17px;font-weight:600;margin-top:2px;}
.fac-col-val.time{color:var(--primary);font-size:22px;}
.key-box{background:var(--danger-light);border-radius:10px;margin:10px 14px 0;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.key-num{font-size:34px;font-weight:700;color:var(--danger);letter-spacing:3px;}
.notes-box{background:var(--accent-light);border-radius:10px;margin:10px 14px 0;padding:12px 16px;}
.notes-lbl{font-size:13px;font-weight:700;color:#8a6000;margin-bottom:6px;}
.notes-txt{font-size:15px;line-height:1.8;white-space:pre-wrap;}
.big-btn{display:block;width:calc(100% - 28px);margin:12px 14px 0;border:none;border-radius:var(--radius);padding:18px;font-size:19px;font-weight:700;cursor:pointer;text-align:center;}
.big-btn.primary{background:var(--primary);color:#fff;}
.big-btn.outline{background:var(--card);color:var(--primary);border:2px solid var(--primary);}
.big-btn.success{background:var(--success);color:#fff;box-shadow:0 4px 12px rgba(26,122,60,.2);}
.big-btn.done{background:#888;color:#fff;}
.cnt-sec{margin:12px 14px 0;}
.cnt-ttl{font-size:15px;font-weight:700;color:var(--text-sub);margin-bottom:8px;}
.cnt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cnt-item{background:var(--card);border-radius:10px;border:1.5px solid var(--border);padding:8px 6px;text-align:center;box-shadow:var(--shadow);}
.cnt-name{font-size:13px;font-weight:600;margin-bottom:6px;min-height:32px;display:flex;align-items:center;justify-content:center;line-height:1.3;}
.cnt-ctrl{display:flex;align-items:center;justify-content:center;gap:6px;}
.cnt-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--primary);background:var(--card);color:var(--primary);font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.cnt-btn:active{background:var(--primary);color:#fff;}
.cnt-num{font-size:22px;font-weight:700;min-width:22px;text-align:center;}
.storage-btn{display:block;width:100%;margin-top:8px;border:2px solid var(--primary);border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer;background:var(--primary-light);color:var(--primary);}
.storage-btn.done{background:var(--success-light);color:var(--success);border-color:var(--success);}
.det-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 14px 0;overflow:hidden;}
.det-row{padding:12px 16px;border-bottom:1px solid var(--border);}
.det-row:last-child{border-bottom:none;}
.det-lbl{font-size:13px;font-weight:700;color:var(--text-sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:5px;}
.det-val{font-size:17px;}
.det-key{font-size:28px;font-weight:700;color:var(--danger);letter-spacing:3px;background:var(--danger-light);display:inline-block;padding:6px 14px;border-radius:8px;}
.det-notes{font-size:15px;line-height:1.8;white-space:pre-wrap;background:var(--accent-light);padding:12px;border-radius:8px;}
.det-photo{width:100%;aspect-ratio:4/3;background:#f0f0f0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#aaa;border:2px dashed #ccc;}
.fin-wrap{padding:40px 20px;text-align:center;}
.fin-icon{font-size:64px;margin-bottom:16px;}
.fin-title{font-size:26px;font-weight:700;color:var(--success);margin-bottom:8px;}
.fin-sub{font-size:17px;color:var(--text-sub);margin-bottom:24px;}
.fin-summary{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:16px;text-align:left;box-shadow:var(--shadow);}
.fin-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:17px;}
.fin-row:last-child{border-bottom:none;font-weight:700;}
.fin-btn{width:100%;border:none;border-radius:var(--radius);padding:18px;font-size:19px;font-weight:700;cursor:pointer;margin-bottom:10px;}
.fin-btn.primary{background:var(--primary);color:#fff;}
.fin-btn.secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border);}
.wb-wrap{padding:12px 14px 80px;}
.wb-post-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:18px;font-weight:700;cursor:pointer;margin-bottom:12px;}
.wb-msg{background:var(--card);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;}
.wb-msg-top{padding:10px 14px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wb-tag{border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:#fff;}
.wb-date{font-size:13px;color:var(--text-sub);}
.wb-author{font-size:13px;color:var(--text-sub);margin-left:auto;}
.wb-content-txt{padding:12px 14px;font-size:17px;font-weight:600;line-height:1.6;}
.wb-chips{padding:6px 14px 12px;display:flex;flex-wrap:wrap;gap:4px;}
.wb-chip{padding:3px 9px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border);background:var(--bg);color:var(--text-sub);}
.wb-chip.ck{background:var(--success-light);color:var(--success);border-color:var(--success);}
.wb-empty{text-align:center;padding:40px;color:var(--text-sub);}
.wb-sec-lbl{font-size:14px;font-weight:700;color:var(--text-sub);padding:4px 2px 8px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;}
.modal-body{background:var(--card);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.modal-close{background:none;border:none;font-size:24px;color:var(--text-sub);cursor:pointer;}
.modal-label{font-size:14px;font-weight:700;color:var(--text-sub);margin-bottom:4px;margin-top:10px;}
.modal-input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg);}
.modal-input:focus{outline:none;border-color:var(--primary);}
.modal-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:16px;background:var(--bg);}
.modal-submit{width:100%;background:var(--primary);color:#fff;border:none;border-radius:var(--radius);padding:16px;font-size:18px;font-weight:700;cursor:pointer;margin-top:16px;}
.storage-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.storage-row:last-child{border-bottom:none;}
</style>
</head>

var DEMO_WB = [];

function getWb(){
  try{
    var msgs=JSON.parse(localStorage.getItem('wb')||'null');
    if(!msgs) return DEMO_WB;
    var cutoff=new Date(); cutoff.setDate(cutoff.getDate()-14); cutoff.setHours(0,0,0,0);
    var filtered=msgs.filter(function(m){
      if(!m.date||m.date.indexOf('/')===-1) return true;
      var p=m.date.split('/');
      var d=new Date(new Date().getFullYear(),parseInt(p[0])-1,parseInt(p[1]));
      return d>=cutoff;
    });
    if(filtered.length!==msgs.length) saveWb(filtered);
    return filtered;
  }catch(e){ return DEMO_WB; }
}
function saveWb(d){ localStorage.setItem('wb',JSON.stringify(d)); }

function postToGas(data){
  if(!GAS_URL) return;
  var params='?action='+encodeURIComponent(data.action);
  Object.keys(data).forEach(function(k){
    if(k!=='action') params+='&'+k+'='+encodeURIComponent(data[k]||'');
  });
  fetch(GAS_URL+params,{method:'GET',redirect:'follow'})
    .catch(function(e){ console.log('GAS送信エラー:',e); });
}

// courseCode(02）→「02コース」形式に変換
function toLabel(c){
  if(c==='全体') return '全体';
  if(c.endsWith('コース')||c.endsWith('業務')) return c;
  return c+'コース';
}

function myUnread(courseCode){
  var today=new Date(); today.setHours(0,0,0,0);
  var label=toLabel(courseCode);
  return getWb().filter(function(m){
    var list=m.course?m.course.split(',').map(function(c){ return c.trim(); }):[];
    if(list.indexOf('全体')===-1&&list.indexOf(label)===-1) return false;
    if(m.confirmed&&m.confirmed[label]) return false;
    var msgDate;
    if(m.date&&m.date.indexOf('/')!==-1&&m.date.length<=5){
      var p=m.date.split('/');
      msgDate=new Date(today.getFullYear(),parseInt(p[0])-1,parseInt(p[1]));
    } else {
      msgDate=new Date(m.date);
    }
    if(isNaN(msgDate)) return true;
    return msgDate>=today;
  });
}

var NAV_KEY = 'navState_v10';

function saveCurrentState(){
  try{
    if(!S.course){ return; } // コース未選択時は保存しない
    localStorage.setItem(NAV_KEY, JSON.stringify(S));
  }catch(e){ console.log('state save error:',e); }
}

function clearCurrentState(){
  try{ localStorage.removeItem(NAV_KEY); }catch(e){}
}

function loadCurrentState(){
  try{
    var raw = localStorage.getItem(NAV_KEY);
    if(!raw) return false;
    var saved = JSON.parse(raw);
    if(!saved || !saved.course) return false;
    // 保存データをSに復元
    Object.keys(saved).forEach(function(k){ S[k]=saved[k]; });
    return true;
  }catch(e){ return false; }
}

function goHome(){
  if(S.course){
    // 集配進行中 → 現在の画面に安全復帰（リセットしない）
    if(S.departureTime){
      showPg('nav');
      setHdr(CNAME[S.course],(S.idx+1)+'/'+facList().length+'件',true,true);
      setTabOn('courses');
      renderNav();
    } else {
      showPg('pre');
      setHdr(CNAME[S.course],'出発前確認',true,false);
      setTabOn('courses');
      renderPre();
    }
  } else {

    S._beforeWb='nav';

    S._beforeWb='pre';
  } else {
    S._beforeWb='courses';

function goBack(){
  if(S.prevPg==='det'){

    S.prevPg='nav';
    showPg('nav'); setHdr(CNAME[S.course],facList().length+'件',true,true);

    showPg('nav'); setHdr(CNAME[S.course],(S.idx+1)+'/'+facList().length+'件',true,true); setTabOn('courses');

    S._beforeWb=null;
    showPg('pre'); setHdr(CNAME[S.course],'出発前確認',true,false); setTabOn('courses'); renderPre();

}

function chgStorage(useId,type,delta){
  if(!S.storage[useId]) S.storage[useId]={冷蔵:0,冷凍:0,常温:0};
  var sc=S.storage[useId];
  var total=0; if(S.counts[useId]) CTYPES.forEach(function(t){ total+=(S.counts[useId][t]||0); });
  var other=type==='冷凍'?sc['常温']:sc['冷凍'];
  var newVal=Math.max(0,(sc[type]||0)+delta);
  if(total-newVal-other<0) return;
  sc[type]=newVal;
  sc['冷蔵']=total-sc['冷凍']-sc['常温'];
  var el=document.getElementById('sc_'+useId+'_'+type);
  if(el) el.textContent=sc[type];
  var elR=document.getElementById('sc_'+useId+'_冷蔵');
  if(elR) elR.textContent=sc['冷蔵'];
  saveCurrentState();
}

function markDone(id){
  S.done[id]=true;
  if(S.isRevisit){
    S.revisits.push({
      facId:id,
      counts:JSON.parse(JSON.stringify(S.counts[S.revisitKey]||{})),
      storage:JSON.parse(JSON.stringify(S.storage[S.revisitKey]||{}))
    });
    S.isRevisit=false;
    S.idx=S.revisitReturnIdx;
    S.revisitReturnIdx=undefined;
    setHdr(CNAME[S.course],facList().length+'件',true,true);
    document.getElementById('hdrRevisit').style.display='block';

    S.idx++;
  }
  saveCurrentState();
  renderNav();
}

  CTYPES.forEach(function(tp){ if(totals[tp]>0) t+=tp+'：'+totals[tp]+'本\n'; });

function renderWb(){
  var msgs=getWb();
  var today=new Date();
  var td=(today.getMonth()+1)+'/'+(today.getDate());
  var toDate=function(s){
    if(!s) return new Date(0);
    if(s.indexOf('/')!==-1&&s.length<=5){
      var p=s.split('/');
      return new Date(today.getFullYear(),parseInt(p[0])-1,parseInt(p[1]));
    }
    var dt=new Date(s);
    return isNaN(dt)?new Date(0):new Date(dt.getFullYear(),dt.getMonth(),dt.getDate());
  };
  var todayD=toDate(td);
  var futureMsgs=msgs.filter(function(m){ return toDate(m.date)>todayD; });
  var todayMsgs=msgs.filter(function(m){ return toDate(m.date).getTime()===todayD.getTime(); });
  var oldMsgs=msgs.filter(function(m){ return toDate(m.date)<todayD; });
  var h='<button class="wb-post-btn" onclick="showWbForm()">&#x270F; ホワイトボードに書き込む</button>';
  if(msgs.length===0){
    h+='<div class="wb-empty">書き込みはありません</div>';
  } else {
    if(todayMsgs.length>0){ h+='<div class="wb-sec-lbl">&#x1F4C5; 本日 '+td+'</div>'; todayMsgs.forEach(function(m){ h+=buildWbCard(m); }); }
    if(futureMsgs.length>0){ h+='<div class="wb-sec-lbl" style="margin-top:8px">&#x1F4C6; 今後の予定</div>'; futureMsgs.forEach(function(m){ h+=buildWbCard(m); }); }
    if(oldMsgs.length>0){
      h+='<div class="wb-sec-lbl" style="margin-top:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleOldWb(this)">'+
         '<span>&#x1F4C2; 過去('+oldMsgs.length+'件）</span><span id="oldArrow" style="font-size:16px;color:var(--text-sub)">&#x25B6;</span></div>'+
         '<div id="oldMsgs" style="display:none">';
      oldMsgs.forEach(function(m){ h+=buildWbCard(m); });
      h+='</div>';
    }
  }
  document.getElementById('wbContent').innerHTML=h;
}

function buildWbCard(m){
  var isAll=m.course==='全体'||m.course.indexOf('全体')!==-1;
  var bg=isAll?'var(--accent)':'var(--primary)';
  var tagTxt=isAll?'&#x1F4E2; 全体':m.course;
  var courseList=m.course?m.course.split(',').map(function(c){ return c.trim(); }):[];
  var targets=isAll?COURSES.map(function(c){ return toLabel(c.code); }):courseList;
  var chips='';
  targets.forEach(function(c){
    var ck=m.confirmed&&m.confirmed[c];
    var label=c.replace(/コース$/,'').replace(/業務$/,'');
    chips+='<span class="wb-chip'+(ck?' ck':'')+'">'+label+(ck?'&#x2713;':'')+'</span>';
  });
  return '<div class="wb-msg">'+
         '<div class="wb-msg-top"><span class="wb-tag" style="background:'+bg+'">'+tagTxt+'</span>'+
         '<span class="wb-date">'+m.date+'</span><span class="wb-author">記入：'+m.author+'</span></div>'+
         '<div class="wb-content-txt">'+m.content+'</div>'+
         (chips?'<div class="wb-chips">'+chips+'</div>':'')+
         '<div style="display:flex;border-top:1px solid var(--border);">'+
         '<button style="flex:1;padding:12px;background:none;border:none;border-right:1px solid var(--border);font-size:16px;font-weight:700;color:var(--primary);cursor:pointer;" onclick="editWbMsg(\''+m.id+'\')">&#x270F; 編集</button>'+
         '<button style="flex:1;padding:12px;background:none;border:none;font-size:16px;font-weight:700;color:var(--danger);cursor:pointer;" onclick="deleteWbMsg(\''+m.id+'\')">&#x1F5D1; 削除</button>'+
         '</div>'+
         '</div>';
}

function toggleOldWb(el){
  var box=document.getElementById('oldMsgs');
  var arrow=document.getElementById('oldArrow');
  if(!box) return;
  var open=box.style.display!=='none';
  box.style.display=open?'none':'block';
  arrow.innerHTML=open?'&#x25B6;':'&#x25BC;';
}

function deleteWbMsg(msgId){
  if(!confirm('このメッセージを削除しますか？')) return;
  var msgs=getWb().filter(function(m){ return m.id!==msgId; });
  saveWb(msgs); renderWb(); updateBadge();
  postToGas({action:'deleteMessage',id:msgId});
}

function editWbMsg(msgId){
  var msgs=getWb();
  var m=msgs.find(function(x){ return x.id===msgId; });
  if(!m) return;
  var today=new Date();
  var parts=m.date.split('/');
  var td=today.getFullYear()+'-'+('0'+parts[0]).slice(-2)+'-'+('0'+parts[1]).slice(-2);
  var opts='';
  ['全体'].concat(COURSES.map(function(c){ return toLabel(c.code); })).forEach(function(c){
    var display=c==='全体'?'&#x1F4E2; 全体(全員宛て）':c;
    opts+='<option value="'+c+'"'+(m.course===c?' selected':'')+'>'+display+'</option>';
  });
  var html='<div class="modal-overlay" id="editModal" onclick="if(event.target===this)this.remove()">'+
    '<div class="modal-body" onclick="event.stopPropagation()">'+
    '<div class="modal-title">&#x270F; 編集<button class="modal-close" onclick="document.getElementById(\'editModal\').remove()">&#xD7;</button></div>'+
    '<div class="modal-label">対象日付</div><input id="editDate" class="modal-input" type="date" value="'+td+'">'+
    '<div class="modal-label">宛先</div><select id="editCourse" class="modal-select">'+opts+'</select>'+
    '<div class="modal-label">内容</div><textarea id="editText" class="modal-input" rows="3" style="resize:none">'+m.content+'</textarea>'+
    '<div class="modal-label">記入者名</div><input id="editAuthor" class="modal-input" type="text" value="'+m.author+'">'+
    '<button class="modal-submit" onclick="submitEdit(\''+msgId+'\')">保存する</button>'+
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

function submitEdit(msgId){
  var dateVal=document.getElementById('editDate').value;
  var d=new Date(dateVal);
  var td=(d.getMonth()+1)+'/'+(d.getDate());
  var course=document.getElementById('editCourse').value;
  var content=document.getElementById('editText').value.trim();
  var author=document.getElementById('editAuthor').value.trim();
  if(!content){ alert('内容を入力してください'); return; }
  if(!author){ alert('記入者名を入力してください'); return; }
  var msgs=getWb();
  var m=msgs.find(function(x){ return x.id===msgId; });
  if(m){ m.date=td; m.course=course; m.content=content; m.author=author; }
  saveWb(msgs);
  document.getElementById('editModal').remove();
  renderWb(); updateBadge();
  postToGas({action:'updateMessage',id:msgId,date:td,course:course,content:content,author:author});
}

function showWbForm(){
  var today=new Date();
  var td=today.getFullYear()+'-'+('0'+(today.getMonth()+1)).slice(-2)+'-'+('0'+today.getDate()).slice(-2);
  var checkboxes='';
  checkboxes+='<label style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:17px;font-weight:600;">'+
    '<input type="checkbox" id="wbcCK全体" value="全体" style="width:22px;height:22px;"> &#x1F4E2; 全体(全員宛て）</label>';
  COURSES.forEach(function(c){
    checkboxes+='<label style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:16px;">'+
      '<input type="checkbox" id="wbcCK'+c.code+'" value="'+c.code+'" style="width:20px;height:20px;"> '+c.name+'</label>';
  });
  var lastAuthor=localStorage.getItem('wbAuthor')||'';
  var html='<div class="modal-overlay" id="wbModal" onclick="if(event.target===this)this.remove()">'+
    '<div class="modal-body" onclick="event.stopPropagation()" style="max-height:85vh;overflow-y:auto;">'+
    '<div class="modal-title">&#x270F; 書き込む<button class="modal-close" onclick="document.getElementById(\'wbModal\').remove()">&#xD7;</button></div>'+
    '<div class="modal-label">対象日付</div><input id="wbDate" class="modal-input" type="date" value="'+td+'">'+
    '<div class="modal-label">宛先(複数選択可）</div>'+
    '<div style="max-height:200px;overflow-y:auto;border:1.5px solid var(--border);border-radius:10px;padding:4px 12px;background:var(--bg);">'+checkboxes+'</div>'+
    '<div class="modal-label">内容</div><textarea id="wbText" class="modal-input" rows="3" placeholder="例：07コース 田中クリニック 至急検体あり" style="resize:none"></textarea>'+
    '<div class="modal-label">記入者名</div><input id="wbAuthorInput" class="modal-input" type="text" placeholder="例：竹内" value="'+lastAuthor+'">'+
    '<button class="modal-submit" onclick="submitWb()">投稿する</button>'+
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
}

function submitWb(){
  var dateVal=document.getElementById('wbDate').value;
  var d=new Date(dateVal);
  var td=(d.getMonth()+1)+'/'+(d.getDate());
  var checkedCourses=[];
  var allIds=['全体'].concat(COURSES.map(function(c){ return c.code; }));
  allIds.forEach(function(id){
    var el=document.getElementById('wbcCK'+id);
    if(el&&el.checked) checkedCourses.push(id);
  });
  if(checkedCourses.length===0){ alert('宛先を1つ以上選択してください'); return; }
  var courseLabels=checkedCourses.map(function(c){ return toLabel(c); });
  var course=courseLabels.join(',');
  var content=document.getElementById('wbText').value.trim();
  var author=document.getElementById('wbAuthorInput').value.trim();
  if(!content){ alert('内容を入力してください'); return; }
  if(!author){ alert('記入者名を入力してください'); return; }
  localStorage.setItem('wbAuthor',author);
  var msgs=getWb();
  var newMsg={id:String(Date.now()),date:td,course:course,content:content,author:author,confirmed:{}};
  msgs.unshift(newMsg);
  saveWb(msgs);
  document.getElementById('wbModal').remove();
  renderWb(); updateBadge();
  postToGas({action:'addMessage',id:newMsg.id,date:td,course:course,content:content,author:author});
}

function updateBadge(){
  var total=0;
  COURSES.forEach(function(c){ try{ total+=myUnread(c.code).length; }catch(e){} });
  var b=document.getElementById('wbBadge');
  if(b){ b.textContent=total; b.style.display=total>0?'block':'none'; }
}

// ── Googleマップ復帰時のabout:blank対策 ──────────────
// SafariのPWAはメモリ不足でページを破棄することがある。
// visibilitychangeで復帰を検知し、ページが死んでいたら自動リロード。
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible'){
    // bodyが空 or スクリプトが死んでたらリロード
    if(!document.getElementById('pg-nav')){
      location.reload();
      return;
    }
    // ページは生きてるが画面状態がリセットされてた場合の保険
    try{
      var raw = localStorage.getItem(NAV_KEY);
      if(raw){
        var saved = JSON.parse(raw);
        if(saved && saved.course && !S.course){
          Object.keys(saved).forEach(function(k){ S[k]=saved[k]; });
          if(S.departureTime){
            showPg('nav');
            setHdr(CNAME[S.course],(S.idx+1)+'/'+facList().length+'件',true,true);
            setTabOn('');
            document.getElementById('hdrRevisit').style.display='block';
            renderNav();
          } else if(S.course){
            showPg('pre');
            setHdr(CNAME[S.course],'出発前確認',true,false);
            setTabOn('');
            renderPre();
          }
        }
      }
    }catch(e){ console.log('visibility restore error:',e); }
  }
});

// 現在のURLをlocalStorageに保存（about:blank対策の保険）
(function saveHomeUrl(){
  if(location.href && location.href.indexOf('about:blank') === -1){
    localStorage.setItem('navHomeUrl', location.href.split('?')[0]);
  }
})();

// 初期化 ── 起動時に前回の集配状態を復元する
(function initApp(){
  var restored = loadCurrentState();
  if(restored && S.course){
    // 前回の集配データあり → 復元して適切な画面へ
    if(S.departureTime){
      // 出発済み → ナビ画面へ
      showPg('nav');
      setHdr(CNAME[S.course],(S.idx+1)+'/'+facList().length+'件',true,true);
      setTabOn('');
      document.getElementById('hdrRevisit').style.display='block';
      renderNav();
    } else {
      // 出発前確認画面へ
      showPg('pre');
      setHdr(CNAME[S.course],'出発前確認',true,false);
      setTabOn('');
      renderPre();
    }
  } else {
    // 通常起動
    renderCourses();
  }
  updateBadge();
  if(GAS_URL){
    fetch(GAS_URL+'?action=getMessages',{redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.messages){
          var normalized=data.messages.map(function(m){
            if(m.date&&m.date.indexOf('/')===-1){
              var dt=new Date(m.date);
              if(!isNaN(dt)) m.date=(dt.getMonth()+1)+'/'+(dt.getDate());
            }
            return m;
          });
          saveWb(normalized);
          updateBadge();
          renderCourses();
          if(document.getElementById('pg-wb').classList.contains('on')) renderWb();
        }
      })
      .catch(function(e){ console.log('GAS取得エラー:',e); });
  }
  // Googleマップから戻ったときのabout:blank対策
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      if(!document.getElementById('pg-nav')){
        var url = localStorage.getItem('navHomeUrl');
        if(url) location.replace(url);
        else location.reload();
      }
    }
  });
  window.addEventListener('pageshow', function(e){
    if(e.persisted && !document.getElementById('pg-nav')){
      location.reload();
    }
  });
  if(location.href.indexOf('about:blank') === -1){
    localStorage.setItem('navHomeUrl', location.href.split('?')[0]);
  }
})();
</script>
